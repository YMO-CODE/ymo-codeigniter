# Marketing site nginx template (reference).
# Use deploy/scripts/setup-nginx-marketing.sh on the VPS — it writes
# /etc/nginx/sites-available/ymo-marketing with HTTP + TLS.
#
# Does NOT touch booking/admin (ymo-booking-admin site file).
# Uses proxy_pass http://127.0.0.1:8080 directly to avoid duplicate upstream blocks.

# --- HTTP (initial + certbot webroot) ---

server {
    listen 80;
    listen [::]:80;
    server_name yourmechaniconline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.yourmechaniconline.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.yourmechaniconline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }
}

# --- HTTPS (after certbot -d yourmechaniconline.com -d www.yourmechaniconline.com) ---

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourmechaniconline.com;

    ssl_certificate /etc/letsencrypt/live/www.yourmechaniconline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.yourmechaniconline.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.yourmechaniconline.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yourmechaniconline.com;

    ssl_certificate /etc/letsencrypt/live/www.yourmechaniconline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.yourmechaniconline.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    include /opt/ymo-codeigniter/deploy/nginx/security-headers.conf;
    include /opt/ymo-codeigniter/deploy/nginx/static-assets.conf;

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }
}
