# Marketing site nginx (add to VPS — does not change booking/admin blocks)

# Apex → www (301)
server {
    listen 80;
    listen [::]:80;
    server_name yourmechaniconline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.yourmechaniconline.com$request_uri;
    }
}

# www → app (marketing host routes in CodeIgniter)
server {
    listen 80;
    listen [::]:80;
    server_name www.yourmechaniconline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ymo_app;
    }
}

