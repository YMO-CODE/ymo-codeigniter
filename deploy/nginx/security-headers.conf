# Security headers for marketing (include inside server { } block on HTTPS www host).
# Re-apply: sudo bash deploy/scripts/setup-nginx-marketing.sh yourmechaniconline.com www.yourmechaniconline.com

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.livechatinc.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.livechatinc.com https://booking.yourmechaniconline.com; frame-src https://secure.livechatinc.com; object-src 'none'; base-uri 'self'; form-action 'self' https://booking.yourmechaniconline.com" always;
