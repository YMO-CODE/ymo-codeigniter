# nginx example: TLS on host, proxy to Docker app on loopback :8080
# Install: copy to /etc/nginx/sites-available/, enable site, certbot.
# Upstream must match deploy/docker-compose.vps.yml (127.0.0.1:8080).

upstream ymo_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name booking.yourmechaniconline.com admin.yourmechaniconline.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name booking.yourmechaniconline.com;

    # ssl_certificate /etc/letsencrypt/live/booking.yourmechaniconline.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/booking.yourmechaniconline.com/privkey.pem;

    client_max_body_size 16M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ymo_app;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.yourmechaniconline.com;

    # ssl_certificate /etc/letsencrypt/live/booking.yourmechaniconline.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/booking.yourmechaniconline.com/privkey.pem;
    # Or run: sudo bash deploy/scripts/setup-nginx.sh booking.… admin.…

    client_max_body_size 16M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ymo_app;
    }
}
