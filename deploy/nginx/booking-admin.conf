# nginx: TLS on host, proxy to Docker app on loopback :8080
# Use deploy/scripts/setup-nginx.sh — do not enable this template directly;
# it contains placeholder SSL blocks. The script writes HTTP-first, then TLS.

upstream ymo_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP — certbot webroot + (optional) app proxy before TLS is issued
server {
    listen 80;
    listen [::]:80;
    server_name booking.yourmechaniconline.com admin.yourmechaniconline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ymo_app;
    }
}
