# Long-cache static assets for marketing nginx (include inside server { } for www host).
# Serves files directly from disk — faster than proxying through PHP.
# Apply after TLS setup: sudo bash deploy/scripts/setup-nginx-marketing.sh ...
#
# Do NOT enable gzip_static unless *.gz sidecars are regenerated on every deploy.
# A stale ymo-marketing.js.gz caused prod to serve months-old JS (no orbit FLIP) while
# local Docker served fresh files. Host-level gzip in marketing nginx still compresses.

location ^~ /assets/ {
    alias /opt/ymo-codeigniter/public/assets/;
    access_log off;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri =404;
}

location = /assets/img/logo.png {
    alias /opt/ymo-codeigniter/public/assets/img/logo.png;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}

location = /assets/img/logo.webp {
    alias /opt/ymo-codeigniter/public/assets/img/logo.webp;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}
