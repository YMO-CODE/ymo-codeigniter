# Long-cache static assets for marketing nginx (include inside server { } for www host).
# Serves files directly from disk — faster than proxying through PHP.
# Apply after TLS setup: sudo bash deploy/scripts/setup-nginx-marketing.sh ...

location ^~ /assets/ {
    alias /opt/ymo-codeigniter/public/assets/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
    gzip_static on;
    try_files $uri =404;
}

location = /assets/img/logo.png {
    alias /opt/ymo-codeigniter/public/assets/img/logo.png;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}

location = /assets/img/logo.webp {
    alias /opt/ymo-codeigniter/public/assets/img/logo.webp;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}
