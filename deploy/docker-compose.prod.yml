# Production overlay — use with docker-compose.yml + docker-compose.vps.yml
#   docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Loads secrets from .env in the project root. MySQL is NOT published publicly.

services:
  app:
    env_file:
      - .env
    environment:
      CI_ENV: production
      YMO_COOKIE_DOMAIN: ${YMO_COOKIE_DOMAIN:-.yourmechaniconline.com}
      YMO_TRUST_PROXY_HEADERS: ${YMO_TRUST_PROXY_HEADERS:-1}
      YMO_DB_HOST: db
      # !override base docker-compose.yml hardcoded dev credentials (ymo_pass).
      YMO_DB_NAME: ${YMO_DB_NAME:-ymo_booking}
      YMO_DB_USER: ${YMO_DB_USER:-ymo_user}
      YMO_DB_PASS: ${YMO_DB_PASS:?Set YMO_DB_PASS in .env}
      YMO_APP_URL: ${YMO_APP_URL:?Set YMO_APP_URL in .env}
      YMO_PUBLIC_APP_URL: ${YMO_PUBLIC_APP_URL:-${YMO_APP_URL}}
      YMO_MARKETING_APP_URL: ${YMO_MARKETING_APP_URL:?Set YMO_MARKETING_APP_URL in .env}
      YMO_ADMIN_APP_URL: ${YMO_ADMIN_APP_URL:-}
      # Mail/SMS/CRM: loaded from env_file (.env) only — do not set empty defaults here
      # or they override env_file and break SMTP after recreate.
    restart: unless-stopped

  db:
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${YMO_DB_NAME:-ymo_booking}
      MYSQL_USER: ${YMO_DB_USER:-ymo_user}
      MYSQL_PASSWORD: ${YMO_DB_PASS:?Set YMO_DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${YMO_DB_ROOT_PASS:-rootpass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${YMO_DB_USER:-ymo_user}", "-p${YMO_DB_PASS}"]
    # !override: do not publish MySQL (base compose maps 3307:3306 for local dev).
    ports: !override []
    restart: unless-stopped
