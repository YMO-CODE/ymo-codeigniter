# Production overlay — use with docker-compose.yml + docker-compose.vps.yml
#   docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Loads secrets from .env in the project root. MySQL is NOT published publicly.

services:
  app:
    env_file:
      - .env
    environment:
      CI_ENV: production
      YMO_DB_HOST: db
    restart: unless-stopped

  db:
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${YMO_DB_NAME:-ymo_booking}
      MYSQL_USER: ${YMO_DB_USER:-ymo_user}
      MYSQL_PASSWORD: ${YMO_DB_PASS:?Set YMO_DB_PASS in .env}
      MYSQL_ROOT_PASSWORD: ${YMO_DB_ROOT_PASS:-rootpass}
    ports: []
    restart: unless-stopped
